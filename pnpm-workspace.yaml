packages:
  - "apps/*"
  - "packages/*"

# @astrojs/astro2tsx (lo usa `astro check`) no publica binario para Windows y
# cae al runtime WASM, que necesita @emnapi/* pero no lo declara.
packageExtensions:
  "@napi-rs/wasm-runtime":
    dependencies:
      "@emnapi/core": "^1.11.3"
      "@emnapi/runtime": "^1.11.3"
